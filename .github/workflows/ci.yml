name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Wait for postgres to be ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - '1025:1025'
          - '8025:8025'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Deploy Prisma Migrations
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db?schema=public
        run: npm run db:migrate:deploy
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db?schema=public
        run: npm run prisma:generate
      - uses: nrwl/nx-set-shas@v4
      - name: Build api for e2e
        # Built in its own step so a build failure is reported as a build
        # failure, instead of surfacing later as an unexplained "the server
        # never came up".
        timeout-minutes: 6
        shell: bash
        env:
          NX_NO_CLOUD: 'true'
        run: npx nx run api:build:development --skipRemoteCache --skipNxCache
      - name: Start e2e dev servers
        # Started here, outside of any nx process, so the e2e task never
        # has to invoke `nx run ...` itself to bring them up - a nested nx
        # CLI call from inside an already-running one deadlocks in CI (the
        # daemon that would otherwise coordinate that is disabled whenever
        # CI=true). See playwright.config.ts and frontend-e2e/project.json
        # for the other halves of this fix.
        #
        # The api runs from its built bundle via plain `node` for that same
        # reason: @nx/js:node executes its buildTarget as a nested `nx run`
        # inside the already-running nx process, which is the deadlock above.
        # The frontend dev-server is an Angular builder and does not nest, so
        # it still goes through nx.
        #
        # timeout-minutes keeps a hang from silently eating the whole job
        # budget - without it the job dies at its own 10m cap and this step's
        # output is never flushed, which hides the actual error.
        timeout-minutes: 6
        shell: bash
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db?schema=public
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: test_db
          EMAIL_PROVIDER: mailpit
          MAILPIT_HOST: localhost
          MAILPIT_PORT: 1025
          QUEUE_DRIVER: memory
          PORT: '3000'
          API_PORT: '3000'
          # NX_CLOUD=false doesn't stop nx from trying (and, right now,
          # failing) to authorize against Nx Cloud - NX_NO_CLOUD is the
          # variable that actually disables it, matching the fallback
          # below and in the "Run affected targets" step.
          NX_NO_CLOUD: 'true'
        run: |
          set -o pipefail

          nohup node dist/apps/api/main.js > /tmp/api-serve.log 2>&1 &
          echo "API_SERVE_PID=$!" >> "$GITHUB_ENV"

          # PORT is set to 3000 for the api above, and Angular 22's dev-server
          # reads PORT from the environment and lets it win over `--port`, so
          # without overriding it here the frontend tries to bind 3000 and
          # loses to the api ("Port 3000 is already in use"). Both are set to
          # 4200 so the env var and the flag agree.
          PORT=4200 nohup npx nx run frontend:serve-e2e --skipRemoteCache --skipNxCache -- --port 4200 > /tmp/frontend-serve.log 2>&1 &
          echo "FRONTEND_SERVE_PID=$!" >> "$GITHUB_ENV"

          wait_for_url() {
            local url="$1" label="$2" log="$3"
            for _ in $(seq 1 60); do
              if curl -fsS --max-time 5 "$url" >/dev/null 2>&1; then
                echo "$label is up."
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready in time." >&2
            echo "--- $label log ---"
            cat "$log" || true
            return 1
          }

          wait_for_url http://localhost:3000/api/health/live "API" /tmp/api-serve.log
          wait_for_url http://localhost:4200 "Frontend" /tmp/frontend-serve.log
      - name: Run affected targets with automatic Nx Cloud fallback
        shell: bash
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db?schema=public
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: test_db
          SMTP_HOST: smtp.ethereal.email
          SMTP_PORT: 587
          SMTP_USER: fake@ethereal.email
          SMTP_PASS: fakepassword
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          if npx nx affected -t lint test build typecheck e2e 2>&1 | tee "$log_file"; then
            exit 0
          fi

          if grep -Eq 'Nx Cloud organization has been disabled|exceeding the FREE plan|unable to be authorized' "$log_file"; then
            echo "Nx Cloud failure detected. Retrying with Nx Cloud disabled..."
            NX_NO_CLOUD=true npx nx affected -t lint test build typecheck e2e --skipRemoteCache --skipNxCache
            exit $?
          fi

          echo "Nx failed for a reason other than Nx Cloud availability."
          exit 1
      - name: Stop e2e dev servers
        if: always()
        shell: bash
        run: |
          [ -n "${API_SERVE_PID:-}" ] && kill "$API_SERVE_PID" 2>/dev/null || true
          [ -n "${FRONTEND_SERVE_PID:-}" ] && kill "$FRONTEND_SERVE_PID" 2>/dev/null || true
      - run: npx nx fix-ci
        if: always()