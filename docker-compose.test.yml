# Test stack for the full-stack e2e lane.
#
# These are services we own, so tests run the real thing rather than a fake
# (see docs/adr/0003-hybrid-e2e-testing-architecture.md). Ports are offset from
# docker-compose.yml so the dev stack can stay up alongside this one.
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v
#
# CI uses service containers instead of this file, on default ports.

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: job-tracker-test-db
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test}
      POSTGRES_DB: ${TEST_DB_NAME:-job_tracker_test}
    ports:
      - '${TEST_DB_PORT:-5433}:5432'
    # No volume on purpose: the test database is disposable, and starting from
    # empty on every `up` keeps runs reproducible.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${TEST_DB_USER:-test}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: job-tracker-test-redis
    ports:
      - '${TEST_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit-test:
    image: axllent/mailpit:latest
    container_name: job-tracker-test-mailpit
    ports:
      - '${TEST_SMTP_PORT:-1026}:1025' # SMTP - point EMAIL_PROVIDER=mailpit here
      - '${TEST_MAILPIT_UI_PORT:-8026}:8025' # REST API + web UI, used by the e2e mail helper
