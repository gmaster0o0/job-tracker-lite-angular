# Test stack for the full-stack e2e lane. Ports are offset from
# docker-compose.yml so the dev stack can stay up alongside it. CI uses
# service containers instead, on default ports.
#
# Distinct project name so the two stacks do not treat each other's
# containers as orphans.
name: job-tracker-test

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test}
      POSTGRES_DB: ${TEST_DB_NAME:-job_tracker_test}
    ports:
      - '${TEST_DB_PORT:-5433}:5432'
    # tmpfs rather than a volume: the test database is disposable.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${TEST_DB_USER:-test}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - '${TEST_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

# No Mailpit here: the e2e lane shares the one in docker-compose.yml. The API
# resolves MAILPIT_* through Nest's ConfigService, where .env takes precedence
# over the environment handed to the process, so an offset SMTP port would be
# ignored. Sharing is safe because every worker provisions a unique recipient.
