<div
  [hlmTooltip]="cooldownTooltip()"
  [tooltipDisabled]="!showCooldownTooltip()"
>
  <button
    hlmBtn
    type="submit"
    [attr.form]="formId()"
    [disabled]="isDisabled()"
    data-testid="submit-btn"
  >
    @if (isSubmitting()) {
      <ng-icon hlm name="lucideLoader2" size="sm" class="animate-spin" />
      {{ submittingLabel() }}
    } @else {
      <ng-icon hlm [name]="idleIcon()" size="sm" />
      {{ label() }}
    }
  </button>
</div>
