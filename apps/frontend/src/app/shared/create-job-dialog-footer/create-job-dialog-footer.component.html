<hlm-dialog-footer>
  <button
    hlmBtn
    variant="outline"
    type="button"
    hlmDialogClose
    data-testid="cancel-btn"
  >
    <ng-icon hlm name="lucideUndo2" size="sm" />{{
      'common.cancel' | transloco
    }}
  </button>

  <app-submit-button
    [formId]="formId()"
    [disabled]="disableSubmit()"
    [isSubmitting]="isSubmitting()"
    [idleLabel]="'common.create' | transloco"
    submittingLabel="Saving..."
  />
</hlm-dialog-footer>
