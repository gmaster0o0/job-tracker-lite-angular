@if (variant() === 'default') {
  <div hlmCard class="w-full shadow-sm transition-all hover:shadow-md">
    <div hlmCardHeader class="p-5 pb-3">
      <div class="flex items-start justify-between">
        <div class="space-y-1.5">
          <h3 hlmCardTitle class="text-xl font-bold tracking-tight">
            {{ job().position }}
          </h3>
          <p hlmCardDescription class="text-base font-medium">
            {{ job().company }}
          </p>
        </div>
        <span
          hlmBadge
          [ngClass]="statusBadgeClasses[job().status]"
          class="shrink-0 text-xs uppercase tracking-[0.02em]"
        >
          {{ job().status }}
        </span>
      </div>
    </div>

    <div
      hlmCardFooter
      class="flex items-center justify-between border-t border-border bg-muted/50 p-4 px-5"
    >
      <span
        class="text-xs font-semibold uppercase tracking-wider text-muted-foreground"
      >
        {{ job().createdAt | appDate }}
      </span>

      <span class="text-xs font-medium text-info"> 1 contacts </span>
    </div>
  </div>
} @else {
  <div
    class="flex w-full cursor-pointer flex-col overflow-hidden rounded-xl border border-border bg-card p-3 text-card-foreground shadow-sm transition-all hover:border-muted-foreground/50"
    [class.border-primary]="selected()"
    [class.shadow]="selected()"
  >
    <div class="flex items-start justify-between gap-2">
      <p class="truncate text-sm font-semibold text-foreground">
        {{ job().position }}
      </p>
      <span
        hlmBadge
        [ngClass]="statusBadgeClasses[job().status]"
        class="shrink-0 text-[10px] uppercase tracking-[0.02em]"
      >
        {{ job().status }}
      </span>
    </div>

    <p class="mt-1 truncate text-xs text-muted-foreground">
      {{ job().company }}
    </p>

    <div class="mt-4 flex items-center justify-between">
      <span class="text-[10px] text-muted-foreground">
        {{ job().createdAt | appDate }}
      </span>
    </div>
  </div>
}
