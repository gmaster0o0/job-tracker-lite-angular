<div hlmCard class="shadow-sm w-full h-fit">
  <div hlmCardContent class="space-y-3 p-6">
    <div class="flex items-start justify-between gap-4">
      <h2 class="text-3xl font-semibold text-foreground">Description</h2>
      <button
        hlmBtn
        [hlmTooltip]="editTooltip()"
        variant="ghost"
        size="icon-sm"
        type="button"
        data-testid="job-overview-edit"
        [attr.aria-label]="editTooltip()"
        (click)="onEdit()"
      >
        <ng-icon hlm size="sm" name="lucidePencil" />
      </button>
    </div>
    <div class="h-px w-full bg-border"></div>
    <article
      class="text-sm leading-relaxed text-muted-foreground [&_h1]:text-2xl [&_h1]:font-bold [&_h1]:mb-4 [&_h1]:mt-6 [&_h1]:text-foreground [&_h1]:block [&_h2]:text-xl [&_h2]:font-semibold [&_h2]:mb-3 [&_h2]:mt-5 [&_h2]:text-foreground [&_h2]:block [&_p]:mb-4 [&_p]:block [&_ul]:list-disc [&_ul]:ml-5 [&_ul]:mb-4 [&_ul]:block [&_ul]:space-y-1 [&_li]:mb-1 [&_strong]:font-bold [&_strong]:text-foreground"
      [innerHTML]="renderedDescription()"
    ></article>
  </div>
</div>
